name: Apply native override runtime payloads

on:
  push:
    branches:
      - dogfood2
    paths:
      - .github/workflows/apply-native-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dogfood2
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 0

      - name: Apply audited native runtime sources
        run: python3 .github/scripts/apply_native_runtime_payloads.py

      - name: Validate ABProps and MobileConfig invariants
        run: python3 scripts/wagr_validate_abprops_fetch.py

      - name: Commit native runtime implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden native ABProps and MobileConfig override pipeline"
          git push origin HEAD:dogfood2
