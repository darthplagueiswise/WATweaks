name: Build dogfood2 rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: dogfood2-rootless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: WATweaks dogfood2 rootless
    runs-on: macos-15
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout dogfood2
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Select GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate dogfood hooks
        run: |
          test -f src/Hooks/WAGREmployeeHooks.xm
          test -f src/Hooks/WAGREmployeeSweep.xm
          test -f src/Menu/WAGRDogfoodMenuPatch.xm
          ! grep -R -n -E 'MSHookFunction|class_replaceMethod|%hookf' \
              src/Hooks/WAGREmployeeHooks.xm \
              src/Hooks/WAGREmployeeSweep.xm \
              src/Menu/WAGRDogfoodMenuPatch.xm
          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile

      - name: Build rootless package
        run: |
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_dogfood2_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
