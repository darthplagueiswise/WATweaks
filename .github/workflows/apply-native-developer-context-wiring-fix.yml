name: Apply native Developer context wiring fix

on:
  push:
    branches:
      - dogfood2
    paths:
      - scripts/apply_native_developer_context_wiring_fix.py
      - .github/workflows/apply-native-developer-context-wiring-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 0

      - name: Apply account-context wiring fix
        run: python3 scripts/apply_native_developer_context_wiring_fix.py

      - name: Validate invariants
        run: |
          python3 scripts/wagr_validate_abprops_fetch.py
          grep -F 'WAGRContextSpyInstallForContext(userContext);' src/Hooks/WAGRNativeDevMenuHooks.xm
          grep -F 'WAGRContextSpyInstallForContext(context);' src/Hooks/WAGRNativeDevMenuHooks.xm
          grep -F 'WAGRContextSpyInstallForContext(realCtx);' src/Hooks/WAGRNativeDevMenuHooks.xm
          ! grep -F 'WAGRContextSpyInstallForObject(userContext);' src/Hooks/WAGRNativeDevMenuHooks.xm
          ! grep -F 'WAGRContextSpyInstallForObject(context);' src/Hooks/WAGRNativeDevMenuHooks.xm
          ! grep -F 'WAGRContextSpyInstallForObject(realCtx);' src/Hooks/WAGRNativeDevMenuHooks.xm

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Hooks/WAGRNativeDevMenuHooks.xm scripts/wagr_validate_abprops_fetch.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
            exit 0
          fi
          git commit -m 'Use full account context for native Developer AB Props'
          git push origin HEAD:dogfood2
