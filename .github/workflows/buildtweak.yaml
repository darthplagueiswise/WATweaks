name: Build WATweaks

on:
  push:
    branches:
      - exp2
      - dogfood2-repair-8150
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_NAME: iPhoneOS26.2.sdk

jobs:
  build:
    name: Build WATweaks
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: iPhoneOS26.2.sdk

      - name: Download iOS 26.2 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git ios-sdks
          cd ios-sdks
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          mv iPhoneOS26.2.sdk "$GITHUB_WORKSPACE/theos/sdks/"

      - name: Build package
        working-directory: main
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
          SDK_NAME: ${{ env.SDK_NAME }}
        run: |
          set -euo pipefail
          chmod +x ./build.sh || true
          ./build.sh

      - name: Normalize package artifact
        working-directory: main
        run: |
          set -euo pipefail
          mkdir -p release
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print | sort | tail -n 1)"
          if [ -z "$deb" ]; then
            echo "No .deb package was produced under packages/." >&2
            find . -maxdepth 4 -type f -name '*.deb' -print >&2 || true
            exit 1
          fi
          padded_run="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          out="release/WATweaks0.1.${padded_run}.deb"
          cp -f "$deb" "$out"
          ls -la release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks0.1.${{ github.run_number }}
          path: main/release/*.deb
          if-no-files-found: error