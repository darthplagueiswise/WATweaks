name: Build WATweaks

on:
  push:
    branches:
      - 'exp2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_NAME: iPhoneOS26.2.sdk
  OUTPUT_BASENAME: WATweaks-sdk26.2

jobs:
  build:
    name: build
    runs-on: macos-15-arm64
    permissions:
      contents: write

    steps:
      - name: Checkout WATweaks
        uses: actions/checkout@v4
        with:
          path: main
          repository: darthplagueiswise/WATweaks

      - name: Install build tools
        run: brew install ldid dpkg make zip

      - name: Add GNU make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iOS SDKs
        id: SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: macOS-theos-sdks-iPhoneOS26.2.sdk
          restore-keys: macOS-theos-sdks-

      - name: Download iPhoneOS 26.2 SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate SDK 26.2 and build rootless arm64
        run: |
          set -euo pipefail
          cd main
          export THEOS="${{ github.workspace }}/theos"
          chmod +x build.sh scripts/*.sh 2>/dev/null || true
          test -d "$THEOS/sdks/$SDK_NAME"
          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q '^ARCHS = arm64$' Makefile
          THEOS_PACKAGE_SCHEME=rootless ./build.sh
          mkdir -p release
          DEB="$(ls -t packages/*rootless*.deb packages/*.deb 2>/dev/null | head -n 1)"
          test -n "$DEB"
          cp "$DEB" "release/${OUTPUT_BASENAME}.deb"
          (cd release && zip -9 "${OUTPUT_BASENAME}.zip" "${OUTPUT_BASENAME}.deb")
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_BASENAME }}-${{ github.run_number }}
          path: main/release/${{ env.OUTPUT_BASENAME }}.zip
          if-no-files-found: error
