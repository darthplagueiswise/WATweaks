name: Build WATweaks

on:
  push:
    branches:
      - 'main'
      - 'dev'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WATweaks
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          chmod +x ./build.sh || true
          find . -name "*.sh" -exec chmod +x {} \; || true

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS16.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "WATweaks_${{ steps.version.outputs.branch_name }}_v${{ steps.version.outputs.base_version }}_#${{ steps.version.outputs.run_number }}"
          path: packages/${{ steps.version.outputs.package_name }}
          if-no-files-found: error
