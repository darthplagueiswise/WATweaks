name: Build WATweaks dogfood2 rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: watweaks-dogfood2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dogfood2 rootless
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate dogfood and live typed runtime sources
        run: |
          files=(
            src/Hooks/WAGREmployeeHooks.xm
            src/Hooks/WAGRDogfoodKnownWAABHooks.xm
            src/Hooks/WAGREmployeeSweep.xm
            src/Hooks/WAGRDebugMenuInstrumentation.xm
            src/Menu/WAGRDogfoodMenuPatch.xm
            src/Menu/WAGRABPropsRootVC.m
            src/Menu/WAGRABPropsBrowserVC.h
            src/Menu/WAGRABPropsBrowserVC.m
            src/Menu/WAGRRuntimeGatesVC.h
            src/Menu/WAGRRuntimeGatesVC.m
            src/Menu/WAGRRuntimeValueEditor.h
            src/Menu/WAGRRuntimeValueEditor.m
            src/Menu/WAGRSurfaceBrowserVC.h
            src/Menu/WAGRSurfaceBrowserVC.m
            src/Runtime/WAGRABPropsRuntime.h
            src/Runtime/WAGRABPropsRuntime.m
            src/Runtime/WAGRRuntimeClassifier.h
            src/Runtime/WAGRRuntimeClassifier.m
            src/Runtime/WAGRRuntimeValueStore.h
            src/Runtime/WAGRRuntimeValueStore.m
            src/Runtime/WAGRSurface.h
            src/Runtime/WAGRSurface.m
            src/WADefaults.m
            src/WAUtils.m
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "ERRO: arquivo ausente: $file"; exit 1; }
          done

          ! grep -R -n -E 'MSHookFunction|class_replaceMethod|%hookf' "${files[@]}"

          if grep -n -E '\bnullable[[:space:]]+id\b' \
              src/Runtime/WAGRABPropsRuntime.h \
              src/Runtime/WAGRRuntimeValueStore.h \
              src/Menu/WAGRABPropsBrowserVC.h \
              src/Menu/WAGRRuntimeValueEditor.h; then
            echo 'ERRO: use id _Nullable em APIs C; nullable id não compila nesta toolchain.'
            exit 1
          fi

          if grep -R -n \
              --include='*.x' --include='*.xm' \
              -E '\{[[:space:]]*[A-Z_][A-Z0-9_]*\([^;]*\);[[:space:]]*return[[:space:]]+%orig;[[:space:]]*\}[[:space:]]*$' \
              src; then
            echo 'ERRO: hook Logos em uma linha com macro + %orig; use corpo multiline explícito.'
            exit 1
          fi

          if grep -R -n -E 'read[- ]only|somente leitura' \
              src/Menu/WAGRABPropsBrowserVC.m \
              src/Menu/WAGRSurfaceBrowserVC.m \
              src/Runtime/WAGRABPropsRuntime.m; then
            echo 'ERRO: o browser runtime não pode regredir para read-only.'
            exit 1
          fi

          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q 'WAGRRuntimeValueInstallHook' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'imp_implementationWithBlock' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'WA_PREF_RUNTIME_VALUE_OVERRIDES' src/WADefaults.m

          # WAAB discovery/categorization is runtime-only. A JSON catalog must
          # not be a functional dependency or a CI gate.
          grep -q 'class_copyMethodList' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRABPropsScan' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'method_getNumberOfArguments(method) != 2' src/Runtime/WAGRABPropsRuntime.m
          ! grep -q 'WAABProperties.json' src/Runtime/WAGRABPropsRuntime.m
          ! grep -q 'WAGRGateRegistry' src/Menu/WAGRABPropsRootVC.m
          grep -q 'WAGRABPropsBrowserVC' src/Menu/WAGRABPropsRootVC.m

          # Runtime image shortcuts resolve the current Mach-O snapshot instead
          # of looking up removed static IDs such as exec/sharedmodules.
          grep -q 'runtimeImageSurfaces' src/Menu/WAGRDogfoodMenuPatch.xm
          grep -q 'runtimeImagePath' src/Menu/WAGRDogfoodMenuPatch.xm
          grep -q 'SharedModules.framework/SharedModules' src/Menu/WAGRDogfoodMenuPatch.xm

          # Categories and subcategories come from the loaded Objective-C
          # runtime, never from the old static provider registry.
          grep -q 'objc_copyClassList' src/Runtime/WAGRSurface.m
          grep -q 'class_getImageName' src/Runtime/WAGRSurface.m
          grep -q 'runtimeImageSurfaces' src/Runtime/WAGRSurface.m
          grep -q 'runtimeFamilySurfaces' src/Runtime/WAGRSurface.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Runtime/WAGRSurface.m
          grep -q 'WAGRLiveRuntimeSubcategoryForEntry' src/Runtime/WAGRSurface.m
          grep -q 'runtimeFamilySurfaces' src/Menu/WAGRRuntimeGatesVC.m
          ! grep -q 'WAGRGateRegistry' src/Menu/WAGRRuntimeGatesVC.m
          grep -q 'scanSurface:spec' src/Menu/WAGRSurfaceBrowserVC.m
          grep -q 'scopeButtonTitles' src/Menu/WAGRSurfaceBrowserVC.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'WAGRPresentRuntimeValueEditor' src/Menu/WAGRABPropsBrowserVC.m

          # Deterministic Dogfood mode must own the known employee/internal and
          # dogfood AB getters instead of relying only on a generic reader.
          grep -q '%hook WAABProperties' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'isMetaEmployeeOrInternalTester' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'private_experimentation_should_sync' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'ios_internal_rage_shake_enabled' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'WAGRDogfoodKnownWAABEnsureInstalled' src/Hooks/WAGREmployeeHooks.xm

          grep -q 'WADebugViewController' src/Hooks/WAGRDebugMenuInstrumentation.xm
          grep -q 'v16@0:8' src/Hooks/WAGRDebugMenuInstrumentation.xm

      - name: Build rootless package
        run: |
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_dogfood2_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
