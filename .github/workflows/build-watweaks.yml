name: Build WATweaks dogfood2 rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: watweaks-dogfood2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dogfood2 rootless
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate dogfood and live typed runtime sources
        run: |
          set -euxo pipefail

          files=(
            src/Menu/WAGRMainSettingsVC.m
            src/Menu/WAGRFeatureBundlesVC.h
            src/Menu/WAGRFeatureBundlesVC.m
            src/Menu/WAGRABPropsRootVC.m
            src/Menu/WAGRABPropsBrowserVC.m
            src/Menu/WAGRABPropsSnapshotVC.m
            src/Menu/WAGRRuntimeBrowserCrashGuard.m
            src/Menu/WAGRRuntimeBrowsersGlassUI.m
            src/Menu/WAGRRuntimeValueEditor.m
            src/Menu/WAGRSurfaceBrowserVC.m
            src/Runtime/WAGRABPropsRuntime.m
            src/Runtime/WAGRABPropsStableIDResolver.m
            src/Runtime/WAGRABPropsNativeStore.m
            src/Runtime/WAGRRuntimeValueStore.m
            src/Runtime/WAGRMobileConfigBridge.m
            src/Runtime/WAGRMobileConfigInternalPreset.m
            src/Hooks/WAAuraHooks.xm
            src/Hooks/WAGRLiquidGlassHooks.xm
            src/Hooks/WAGREmployeeHooks.xm
            src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "ERRO: arquivo ausente: $file"; exit 1; }
          done

          # Build/runtime invariants retained from the verified 8150 base.
          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q 'WAGRRuntimeValueInstallHook' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'imp_implementationWithBlock' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'class_copyMethodList' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRPresentRuntimeValueEditor' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsNativeStore.m
          grep -q 'WAGRABPropsStableIDForTarget' src/Menu/WAGRRuntimeBrowsersGlassUI.m

          # ABProps/Runtime browsers must stay editable and exact-receiver based.
          ! grep -R -n -E 'read[- ]only|somente leitura' \
              src/Menu/WAGRABPropsBrowserVC.m src/Menu/WAGRSurfaceBrowserVC.m
          ! grep -n 'object_getIvar' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          ! grep -n '\[cls alloc\]' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          grep -q 'isKindOfClass:cls' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'PENDING' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'WAGRRuntimeValueHookIsInstalled' src/Menu/WAGRABPropsBrowserVC.m

          # iOS 26 browser chrome requested by the project: glass title and
          # native morphing toolbar search. Names remain single-line/readable.
          grep -q 'UIGlassEffectStyleRegular' src/Menu/WAGRRuntimeBrowsersGlassUI.m
          grep -q 'searchBarPlacementBarButtonItem' src/Menu/WAGRRuntimeBrowsersGlassUI.m
          grep -q 'numberOfLines = 1' src/Menu/WAGRRuntimeBrowsersGlassUI.m

          # Canonical feature architecture: one compact root; Internal, Liquid
          # Glass and Aura live in submenus and share the GateStore ->
          # RuntimeValueStore bridge used by ABProperties Browser.
          grep -q 'WAGRFeatureBundlesVC' src/Menu/WAGRMainSettingsVC.m
          grep -q 'Internal / Employee / Dogfood' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'Liquid Glass' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'Aura / WA Plus' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'WAGRGateSet' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'WAGRRuntimeValueSetOverride' src/Runtime/WAGRGateStore.m
          ! grep -q 'kWAGREmployeeMaster' src/Hooks/WAGREmployeeHooks.xm
          ! grep -q 'kWAGRAuraSimulation' src/Hooks/WAAuraHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAAuraHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAGRLiquidGlassHooks.xm

          # No Swizzle product/category should be reintroduced. Individual
          # swizzle-related ABProps remain discoverable only as normal ABProps.
          ! grep -R -n -E 'Swizzle ABProps|Swizzle master|BundleSwizzle' \
              src/Menu src/Hooks

          # MobileConfig identity must be resolver-driven. Never use WA AB ID,
          # localConfigIndex or compact token as a top-level mc_overrides key.
          grep -q 'mapping.configStableId' src/Runtime/WAGRMobileConfigInternalPreset.m
          grep -q 'mapping.parameterIndex' src/Runtime/WAGRMobileConfigInternalPreset.m
          grep -q 'mapping.configName' src/Runtime/WAGRMobileConfigInternalPreset.m
          grep -q 'mapping.parameterName' src/Runtime/WAGRMobileConfigInternalPreset.m

          # The native fetch path remains the path validated from SharedModules.
          grep -q 'networkingDependencyProvider' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'xmppConnectionABPropsRequestManager' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsRequestManagerBridge.m
          ! grep -q 'MSHookFunction' src/Runtime/WAGRABPropsRequestManagerBridge.m

          # Sideload-safe rule for the edited surface.
          ! grep -R -n -E 'MSHookFunction|class_replaceMethod|%hookf' "${files[@]}"

      - name: Build rootless package
        run: |
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_dogfood2_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
