name: Build WATweaks

on:
  push:
    branches:
      - 'alpha'
      - 'dev'
      - 'main'
      - 'alpha2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WATweaks
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          chmod +x ./build.sh || true
          find . -name "*.sh" -exec chmod +x {} \; || true

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Set dev package version
        id: version
        run: |
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          PADDED_RUN=$(printf '%03d' "$RUN_NUMBER")
          BUILD_VERSION="0.1.${PADDED_RUN}"
          PACKAGE_NAME="WATweaks${BUILD_VERSION}.deb"
          sed -i '' "s/^Version:.*/Version: ${BUILD_VERSION}/" control
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=${RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "PADDED_RUN=${PADDED_RUN}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "run_number=${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "padded_run=${PADDED_RUN}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using package version ${BUILD_VERSION} (${PACKAGE_NAME})"
          grep '^Version:' control

      - name: Build package
        run: |
          set -euo pipefail
          export THEOS="${{ github.workspace }}/theos"
          test -d "$THEOS/sdks/iPhoneOS26.2.sdk"
          chmod +x ./build.sh || true
          THEOS_PACKAGE_SCHEME=rootless bash ./build.sh
          cd packages
          DEB="$(find . -maxdepth 1 -type f -name '*.deb' -print | sort | tail -n 1 | sed 's#^./##')"
          test -n "$DEB"
          mv -f "$DEB" "$PACKAGE_NAME"
          test -f "$PACKAGE_NAME"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "WATweaks${{ steps.version.outputs.build_version }}"
          path: packages/${{ steps.version.outputs.package_name }}
          if-no-files-found: error
