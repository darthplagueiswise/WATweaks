name: Build WATweaks dogfood2 rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: watweaks-dogfood2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dogfood2 rootless
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate dogfood and live typed runtime sources
        run: |
          files=(
            src/Hooks/WAGREmployeeHooks.xm
            src/Hooks/WAGRDebugBuildHooks.xm
            src/Hooks/WAGRDogfoodKnownWAABHooks.xm
            src/Hooks/WAGREmployeeSweep.xm
            src/Hooks/WAGRInternalToolsSweep.xm
            src/Hooks/WAGRDebugMenuInstrumentation.xm
            src/Menu/WAGRDogfoodMenuPatch.xm
            src/Menu/WAGRABPropsRootVC.m
            src/Menu/WAGRABPropsBrowserVC.h
            src/Menu/WAGRABPropsBrowserVC.m
            src/Menu/WAGRRuntimeGatesVC.h
            src/Menu/WAGRRuntimeGatesVC.m
            src/Menu/WAGRRuntimeValueEditor.h
            src/Menu/WAGRRuntimeValueEditor.m
            src/Menu/WAGRSurfaceBrowserVC.h
            src/Menu/WAGRSurfaceBrowserVC.m
            src/Menu/WAGRMenuTheme.h
            src/Menu/WAGRMenuTheme.m
            src/Runtime/WAGRABPropsNativeStore.h
            src/Runtime/WAGRABPropsNativeStore.m
            src/Runtime/WAGRABPropsCanonicalNamesV2.h
            src/Runtime/WAGRABPropsCanonicalNamesV2.m
            src/Runtime/WAGRABPropsRequestManagerBridge.m
            src/Runtime/WAGRUserContextLinkage.h
            src/Runtime/WAGRABPropsRuntime.h
            src/Runtime/WAGRABPropsRuntime.m
            src/Runtime/WAGRNativeABPropsResolver.h
            src/Runtime/WAGRNativeABPropsResolver.m
            src/Runtime/WAGRRuntimeClassifier.h
            src/Runtime/WAGRRuntimeClassifier.m
            src/Runtime/WAGRRuntimeValueStore.h
            src/Runtime/WAGRRuntimeValueStore.m
            src/Runtime/WAGRSurface.h
            src/Runtime/WAGRSurface.m
            src/WADefaults.m
            src/WAUtils.m
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "ERRO: arquivo ausente: $file"; exit 1; }
          done

          ! grep -R -n -E 'MSHookFunction|class_replaceMethod|%hookf' "${files[@]}"

          if grep -n -E '\bnullable[[:space:]]+id\b' \
              src/Runtime/WAGRABPropsRuntime.h \
              src/Runtime/WAGRNativeABPropsResolver.h \
              src/Runtime/WAGRRuntimeValueStore.h \
              src/Menu/WAGRABPropsBrowserVC.h \
              src/Menu/WAGRRuntimeValueEditor.h; then
            echo 'ERRO: use id _Nullable em APIs C; nullable id não compila nesta toolchain.'
            exit 1
          fi

          if grep -R -n \
              --include='*.x' --include='*.xm' \
              -E '\{[[:space:]]*[A-Z_][A-Z0-9_]*\([^;]*\);[[:space:]]*return[[:space:]]+%orig;[[:space:]]*\}[[:space:]]*$' \
              src; then
            echo 'ERRO: hook Logos em uma linha com macro + %orig; use corpo multiline explícito.'
            exit 1
          fi

          if grep -R -n -E 'read[- ]only|somente leitura' \
              src/Menu/WAGRABPropsBrowserVC.m \
              src/Menu/WAGRSurfaceBrowserVC.m \
              src/Runtime/WAGRABPropsRuntime.m; then
            echo 'ERRO: o browser runtime não pode regredir para read-only.'
            exit 1
          fi

          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q 'WAGRRuntimeValueInstallHook' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'imp_implementationWithBlock' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'WA_PREF_RUNTIME_VALUE_OVERRIDES' src/WADefaults.m
          grep -q 'WA_PREF_INTERNAL_TOOLS_SWEEP_BACKUP' src/WADefaults.m

          # WAAB discovery/categorization is runtime-only. JSON is not a source,
          # dependency or CI gate.
          grep -q 'class_copyMethodList' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRABPropsScan' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'method_getNumberOfArguments(method) != 2' src/Runtime/WAGRABPropsRuntime.m
          grep -q '#import "WAGRSurface.h"' src/Runtime/WAGRABPropsRuntime.h
          ! grep -R -n 'WAABProperties.json' src/Runtime src/Menu src/Hooks
          ! grep -q 'WAGRGateRegistry' src/Menu/WAGRABPropsRootVC.m
          grep -q 'WAGRABPropsBrowserVC' src/Menu/WAGRABPropsRootVC.m

          # Native Developer UI belongs to WhatsApp. Instrumentation may capture
          # the real userContext, but must not insert/remove an AB Props row.
          grep -q 'WADebugViewController' src/Hooks/WAGRDebugMenuInstrumentation.xm
          grep -q 'WAGRRememberUserContext' src/Hooks/WAGRDebugMenuInstrumentation.xm
          grep -q 'Developer UI untouched' src/Hooks/WAGRDebugMenuInstrumentation.xm
          grep -q 'viewDidLoad' src/Hooks/WAGRDebugMenuInstrumentation.xm
          grep -q 'viewDidAppear:' src/Hooks/WAGRDebugMenuInstrumentation.xm
          ! grep -q 'addTableRowWithCellStyle' src/Hooks/WAGRDebugMenuInstrumentation.xm
          ! grep -q 'deleteRow:' src/Hooks/WAGRDebugMenuInstrumentation.xm
          ! grep -q 'watweaks.native.abprops.entry' src/Hooks/WAGRDebugMenuInstrumentation.xm
          ! grep -q 'WAGRRowIsRCWarning' src/Hooks/WAGRDebugMenuInstrumentation.xm

          # Current-build ABProps fetch path comes from the supplied Mach-O:
          # context -> networkingDependencyProvider -> xmppConnection ->
          # xmppConnectionABPropsRequestManager -> exact requestFreshABProps ABI.
          grep -q 'networkingDependencyProvider' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'xmppConnectionABPropsRequestManager' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'initWithUserContext:xmppConnection:' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'class_addMethod' src/Runtime/WAGRABPropsRequestManagerBridge.m
          ! grep -q 'MSHookFunction' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsNativeStore.m
          grep -q 'no heuristic fetch/sync method was invoked' src/Runtime/WAGRABPropsNativeStore.m

          # Native ABProp naming remains read-only and is decoded from getter
          # descriptors in current app-owned images.
          grep -q 'WAGRABPropsCanonicalNameForCode' src/Runtime/WAGRABPropsCanonicalNamesV2.m
          grep -q 'class_copyMethodList' src/Runtime/WAGRABPropsCanonicalNamesV2.m
          ! grep -q 'MSHookFunction' src/Runtime/WAGRABPropsCanonicalNamesV2.m

          # iOS 26 internal UI uses the public UIKit Liquid Glass API; older OSes
          # retain a material fallback.
          grep -q 'UIGlassEffect' src/Menu/WAGRMenuTheme.m
          grep -q 'UIGlassEffectStyleRegular' src/Menu/WAGRMenuTheme.m
          grep -q 'UIGlassEffectStyleClear' src/Menu/WAGRMenuTheme.m
          grep -q 'UIBlurEffectStyleSystemMaterialDark' src/Menu/WAGRMenuTheme.m
          grep -q 'backgroundEffect' src/Menu/WAGRMenuTheme.m

          # Runtime image shortcuts resolve the current Mach-O snapshot instead
          # of looking up removed IDs such as exec/sharedmodules.
          grep -q 'runtimeImageSurfaces' src/Menu/WAGRDogfoodMenuPatch.xm
          grep -q 'runtimeImagePath' src/Menu/WAGRDogfoodMenuPatch.xm
          grep -q 'SharedModules.framework/SharedModules' src/Menu/WAGRDogfoodMenuPatch.xm

          # Categories and subcategories come from the loaded Objective-C runtime.
          grep -q 'objc_copyClassList' src/Runtime/WAGRSurface.m
          grep -q 'class_getImageName' src/Runtime/WAGRSurface.m
          grep -q 'runtimeImageSurfaces' src/Runtime/WAGRSurface.m
          grep -q 'runtimeFamilySurfaces' src/Runtime/WAGRSurface.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Runtime/WAGRSurface.m
          grep -q 'WAGRLiveRuntimeSubcategoryForEntry' src/Runtime/WAGRSurface.m
          grep -q 'runtimeFamilySurfaces' src/Menu/WAGRRuntimeGatesVC.m
          ! grep -q 'WAGRGateRegistry' src/Menu/WAGRRuntimeGatesVC.m
          grep -q 'scanSurface:spec' src/Menu/WAGRSurfaceBrowserVC.m
          grep -q 'scopeButtonTitles' src/Menu/WAGRSurfaceBrowserVC.m
          grep -q 'WAGRLiveRuntimeFamilyForSelector' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'WAGRPresentRuntimeValueEditor' src/Menu/WAGRABPropsBrowserVC.m

          # One master owns Employee/Internal/Tester/Dogfood and the complete
          # current-build internal/debug/tool surface. The fresh sweep only walks
          # WAABProperties after an explicit user action; launch reinstalls exact
          # persisted hooks and never scans all classes.
          grep -q '%hook WAABProperties' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'username_dogfooding_pn_privacy_enabled' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'graphQLEmployeeC1Disabled' src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          grep -q 'wa_asteria_tools_tab_entrypoint_enabled' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'stella_filebus_enabled' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'ai_meta_ai_in_app_tab_main_gate_enabled' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'bonsai_remove_meta_ai_shortcut_setting_switch" : @NO' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'WAGRInternalToolsSweepSetEnabled(YES)' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'class_copyMethodList' src/Hooks/WAGRInternalToolsSweep.xm
          grep -q 'WAGRInternalToolsMethodIsZeroArgBool' src/Hooks/WAGRInternalToolsSweep.xm
          grep -q 'WAGRGateInstallHookForSelector' src/Hooks/WAGRInternalToolsSweep.xm
          grep -q 'WAGRGateForgetHook' src/Hooks/WAGRInternalToolsSweep.xm
          ! grep -q 'objc_copyClassList' src/Hooks/WAGRInternalToolsSweep.xm
          ! grep -q 'dispatch_after' src/Hooks/WAGRInternalToolsSweep.xm

          # Debug build uses only the object-ABI Kotlin source. The C build-type
          # symbol was tied to telemetry and must not be rebound.
          grep -q '_TtC21WAAppStateSyncContext17KmpAppleBuildInfo' src/Hooks/WAGRDebugBuildHooks.xm
          grep -q 'getBuildType' src/Hooks/WAGRDebugBuildHooks.xm
          grep -q 'WASDEKmpBuildType' src/Hooks/WAGRDebugBuildHooks.xm
          grep -q 'sel_registerName("debug")' src/Hooks/WAGRDebugBuildHooks.xm
          grep -q 'MSHookMessageEx' src/Hooks/WAGRDebugBuildHooks.xm
          ! grep -q 'rebind_symbols' src/Hooks/WAGRDebugBuildHooks.xm
          ! grep -q 'WAGRHookBuildTypeValue' src/Hooks/WAGRDebugBuildHooks.xm
          ! grep -q '%hook WASDEKotlinSelectorsHolder' src/Hooks/WAGRDebugBuildHooks.xm
          ! grep -q 'objc_getClass("WASDEKotlinSelectorsHolder")' src/Hooks/WAGRDebugBuildHooks.xm
          grep -q 'WAGRDebugBuildEnsureInstalled' src/Hooks/WAGREmployeeHooks.xm

      - name: Build rootless package
        run: |
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_dogfood2_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
