name: Build WATweaks

on:
  push:
    branches:
      - 'beta'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WATweaks
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          chmod +x ./build.sh || true
          find . -name "*.sh" -exec chmod +x {} \; || true

      - name: Install dependencies
        run: brew install ldid dpkg make

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: SDK caching
        id: sdk
        uses: actions/cache@v4
        env:
          cache-name: iPhoneOS16.2.sdk
        with:
          path: ${{ env.THEOS }}/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS16.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks/"

      - name: Set package metadata
        id: version
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          base_version="$(awk '/^Version:/ {print $2; exit}' control)"
          run_number="${GITHUB_RUN_NUMBER}"
          package_name="WATweaks_${branch_name}_v${base_version}_#${run_number}.deb"
          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "run_number=${run_number}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: ./build.sh

      - name: Normalize package artifact
        run: |
          mkdir -p packages
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "No .deb package was produced under packages/." >&2
            find . -maxdepth 4 -type f -name '*.deb' -print >&2 || true
            exit 1
          fi
          target="packages/${{ steps.version.outputs.package_name }}"
          if [ "$deb" != "$target" ]; then
            cp -f "$deb" "$target"
          fi
          ls -la packages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "WATweaks_${{ steps.version.outputs.branch_name }}_v${{ steps.version.outputs.base_version }}_#${{ steps.version.outputs.run_number }}"
          path: packages/${{ steps.version.outputs.package_name }}
          if-no-files-found: error
