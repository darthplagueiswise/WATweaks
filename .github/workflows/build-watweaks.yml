name: Build WATweaks canonical 8150 rebuild

on:
  push:
    branches:
      - dogfood2-rebuild-8df
  workflow_dispatch:

concurrency:
  group: watweaks-8150-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build canonical 8150 rebuild rootless
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout exact pushed ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate canonical 8150 rebuild sources
        run: |
          set -euxo pipefail

          files=(
            Makefile
            src/Menu/WAGRMainSettingsVC.h
            src/Menu/WAGRMainSettingsVC.m
            src/Menu/WAGRABPropsRootVC.h
            src/Menu/WAGRABPropsRootVC.m
            src/Menu/WAGRABPropsBrowserVC.h
            src/Menu/WAGRABPropsBrowserVC.m
            src/Menu/WAGRABPropsFilteredBrowserVC.h
            src/Menu/WAGRABPropsFilteredBrowserVC.m
            src/Menu/WAGRValidatedNativeGatesVC.h
            src/Menu/WAGRValidatedNativeGatesVC.m
            src/Menu/WAGRSurfaceBrowserVC.h
            src/Menu/WAGRSurfaceBrowserVC.m
            src/Menu/WAGRRuntimeBrowserCrashGuard.m
            src/Menu/WAGRRuntimeObjectFullscreenEditor.m
            src/Runtime/WAGRFeatureState.h
            src/Runtime/WAGRFeatureState.m
            src/Runtime/WAGRABPropsRuntime.h
            src/Runtime/WAGRABPropsRuntime.m
            src/Runtime/WAGRABPropsNativeStore.h
            src/Runtime/WAGRABPropsNativeStore.m
            src/Runtime/WAGRABPropsStorageAudit.h
            src/Runtime/WAGRABPropsStorageAudit.m
            src/Runtime/WAGRRuntimeValueStore.h
            src/Runtime/WAGRRuntimeValueStore.m
            src/Runtime/WAGRMobileConfigBridge.h
            src/Runtime/WAGRMobileConfigBridge.m
            src/Hooks/WAAuraHooks.xm
            src/Hooks/WAGRLiquidGlassHooks.xm
            src/Hooks/WAGREmployeeHooks.xm
            src/Hooks/WAGRDogfoodKnownWAABHooks.xm
            src/Hooks/WAGREmployeeSweep.xm
            src/Hooks/WAGRInternalToolsSweep.xm
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "ERRO: arquivo ausente: $file"; exit 1; }
          done

          # This rebuild deliberately uses the actual 8150 menu architecture.
          # FeatureSubmenu was an intermediate router design and must not be
          # recreated merely to satisfy an obsolete source manifest.
          test ! -e src/Menu/WAGRFeatureSubmenuVC.h
          test ! -e src/Menu/WAGRFeatureSubmenuVC.m
          grep -q 'WAGRABPropsFilteredBrowserVC' src/Menu/WAGRMainSettingsVC.m
          grep -q 'WAGRValidatedNativeGatesVC' src/Menu/WAGRMainSettingsVC.m
          grep -q 'query:@"aura_"' src/Menu/WAGRMainSettingsVC.m
          grep -q 'query:@"ios_liquid_glass_"' src/Menu/WAGRMainSettingsVC.m
          grep -q 'WAGRABPropsRootVC' src/Menu/WAGRMainSettingsVC.m
          grep -q 'WAGRSurfaceBrowserVC' src/Menu/WAGRMainSettingsVC.m

          # Curated Employee/Internal/Dogfood and ABProperties Browser share the
          # exact same typed RuntimeValueStore.
          grep -q 'WAGRFeatureReadBool' src/Menu/WAGRValidatedNativeGatesVC.m
          grep -q 'WAGRFeatureSetBool' src/Menu/WAGRValidatedNativeGatesVC.m
          grep -q 'WAGRRuntimeValueAllOverrideSpecs' src/Runtime/WAGRFeatureState.m
          grep -q 'WAGRRuntimeValueSetOverride' src/Runtime/WAGRFeatureState.m
          grep -q 'WAGRRuntimeValueClearOverride' src/Runtime/WAGRFeatureState.m
          grep -q 'WAGRABPropsNativeExportDocument' src/Runtime/WAGRFeatureState.m

          # Receiver discovery must remain conservative and never fabricate an
          # unknown WhatsApp instance.
          grep -q 'WAGRSafeReceiverForEntry' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          grep -q 'WAGRSafeExactReceiver' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          ! grep -q 'class_createInstance' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          ! grep -q '\[cls alloc\]' src/Menu/WAGRRuntimeBrowserCrashGuard.m

          # Preserve wamo_abprops_list's outer object ABI and validate the typed
          # JSON descriptor payload internally.
          grep -q 'wamo_abprops_list' src/Menu/WAGRRuntimeObjectFullscreenEditor.m
          grep -q 'typedABPropsSchema' src/Menu/WAGRRuntimeObjectFullscreenEditor.m
          grep -q 'WAGRFullValidateABPropsSchema' src/Menu/WAGRRuntimeObjectFullscreenEditor.m
          grep -q 'WAGRRuntimeValueSetOverride' src/Menu/WAGRRuntimeObjectFullscreenEditor.m

          # Native fetch and storage audit remain on the real current-build path.
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsNativeStore.m
          grep -q 'Deliberately do NOT call -synchronize' src/Runtime/WAGRABPropsStorageAudit.m

          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q 'WAGRRuntimeValueInstallHook' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'imp_implementationWithBlock' src/Runtime/WAGRRuntimeValueStore.m

          python3 scripts/wagr_validate_sources.py
          python3 scripts/wagr_validate_sideload_hooks.py

      - name: Build rootless package
        run: |
          set -euxo pipefail
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          set -euxo pipefail
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_8150_rebuild_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-8150-rebuild-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
