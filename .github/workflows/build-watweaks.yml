name: Build WATweaks dogfood2 rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: watweaks-dogfood2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dogfood2 rootless
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make xz

      - name: Set GNU make path
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS26.2.sdk
          key: iPhoneOS26.2.sdk-v1

      - name: Download iOS 26.2 SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git sdk-source
          cd sdk-source
          git sparse-checkout set --no-cone iPhoneOS26.2.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS26.2.sdk "$THEOS/sdks/"

      - name: Validate dogfood and live typed runtime sources
        run: |
          set -euxo pipefail

          files=(
            src/Menu/WAGRMainSettingsVC.m
            src/Menu/WAGRFeatureBundlesVC.h
            src/Menu/WAGRFeatureBundlesVC.m
            src/Menu/WAGRABPropsFilteredBrowserVC.h
            src/Menu/WAGRABPropsFilteredBrowserVC.m
            src/Menu/WAGRABPropsRootVC.m
            src/Menu/WAGRABPropsBrowserVC.m
            src/Menu/WAGRABPropsLiveCorrelation.m
            src/Menu/WAGRABPropsSnapshotVC.m
            src/Menu/WAGRABPropsMCNativeApplyUI.m
            src/Menu/WAGRDebugDiagnosticsVC.h
            src/Menu/WAGRDebugDiagnosticsVC.m
            src/Menu/WAGRDebugNativeEngineEnrichment.m
            src/Menu/WAGRRuntimeBrowserCrashGuard.m
            src/Menu/WAGRRuntimeBrowsersGlassUI.m
            src/Menu/WAGRRuntimeValueEditor.m
            src/Menu/WAGRSurfaceBrowserVC.m
            src/Runtime/WAGRABPropsRuntime.m
            src/Runtime/WAGRABPropsStableIDResolver.h
            src/Runtime/WAGRABPropsStableIDResolver.m
            src/Runtime/WAGRABPropsNativeStore.m
            src/Runtime/WAGRRuntimeValueStore.m
            src/Runtime/WAGRMobileConfigBridge.m
            src/Runtime/WAGRMobileConfigRuntimeResolver.m
            src/Runtime/WAGRMobileConfigUserSessionBridge.h
            src/Runtime/WAGRMobileConfigUserSessionBridge.m
            src/Runtime/WAGRMobileConfigNativeEngine.h
            src/Runtime/WAGRMobileConfigNativeEngine.m
            src/Hooks/WAAuraHooks.xm
            src/Hooks/WAGRLiquidGlassHooks.xm
            src/Hooks/WAGREmployeeHooks.xm
            src/Hooks/WAGRDogfoodKnownWAABHooks.xm
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "ERRO: arquivo ausente: $file"; exit 1; }
          done

          # Build/runtime invariants retained from the last verified launch-safe base.
          grep -q 'TARGET := iphone:clang:26.2:15.0' Makefile
          grep -q 'WAGRRuntimeValueInstallHook' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'imp_implementationWithBlock' src/Runtime/WAGRRuntimeValueStore.m
          grep -q 'class_copyMethodList' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'WAGRPresentRuntimeValueEditor' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsNativeStore.m
          grep -q 'WAGRABPropsStableIDForTarget' src/Menu/WAGRRuntimeBrowsersGlassUI.m

          # ABProps/Runtime browsers must stay editable and exact-receiver based.
          ! grep -R -n -E 'read[- ]only|somente leitura' \
              src/Menu/WAGRABPropsBrowserVC.m src/Menu/WAGRSurfaceBrowserVC.m
          ! grep -n 'object_getIvar' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          ! grep -n '\[cls alloc\]' src/Menu/WAGRRuntimeBrowserCrashGuard.m
          grep -q 'isKindOfClass:cls' src/Runtime/WAGRABPropsRuntime.m
          grep -q 'PENDING' src/Menu/WAGRABPropsBrowserVC.m
          grep -q 'WAGRRuntimeValueHookIsInstalled' src/Menu/WAGRABPropsBrowserVC.m

          # iOS 26 browser chrome requested by the project.
          grep -q 'UIGlassEffectStyleRegular' src/Menu/WAGRRuntimeBrowsersGlassUI.m
          grep -q 'searchBarPlacementBarButtonItem' src/Menu/WAGRRuntimeBrowsersGlassUI.m
          grep -q 'numberOfLines = 1' src/Menu/WAGRRuntimeBrowsersGlassUI.m

          # Features are semantic views over the current runtime. Product selector
          # inventories/AB IDs must not return to WAGRFeatureBundlesVC.
          grep -q 'WAGRFeatureBundlesVC' src/Menu/WAGRMainSettingsVC.m
          grep -q 'WAGRABPropsScan' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'WAGRABPropsStableIDForTarget' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'WAGRABPropsFilteredBrowserVC' src/Menu/WAGRFeatureBundlesVC.m
          grep -q 'Categorias com zero resultados são ocultadas' src/Menu/WAGRFeatureBundlesVC.m
          ! grep -q 'WAGRWAAB(' src/Menu/WAGRFeatureBundlesVC.m
          ! grep -q 'WAGRGateSet' src/Menu/WAGRFeatureBundlesVC.m
          ! grep -E -q 'AB [0-9]{3,}' src/Menu/WAGRFeatureBundlesVC.m

          # Current-build stable IDs are decoded from live getter IMPs, including
          # the ADRP/ADD -> __cfstring -> decimal bytes indirection.
          grep -q 'WAGRABDecimalConstantStringAtAddress' src/Runtime/WAGRABPropsStableIDResolver.m
          grep -q 'resolved_cfconstantstring' src/Runtime/WAGRABPropsStableIDResolver.m
          grep -q 'identity_source.*live getter IMP' src/Menu/WAGRABPropsLiveCorrelation.m

          # Identity-sensitive MobileConfig work requires the account UserSession.
          # sessionless/default may not be substituted by the runtime resolver.
          grep -q 'WAGRMobileConfigUserSessionContextManager' src/Runtime/WAGRMobileConfigRuntimeResolver.m
          ! grep -q 'sessionlessContextManager' src/Runtime/WAGRMobileConfigRuntimeResolver.m
          ! grep -q 'defaultValueContextManager' src/Runtime/WAGRMobileConfigRuntimeResolver.m
          grep -q 'WAProperties.setMobileConfig:' src/Runtime/WAGRMobileConfigUserSessionBridge.m
          grep -q 'WAABProperties.setMobileConfig:' src/Runtime/WAGRMobileConfigUserSessionBridge.m
          grep -q 'WAGRMobileConfigLiveUserSessionManager' src/Runtime/WAGRMobileConfigUserSessionBridge.m

          # Native override application writes only to the exact UserSession path,
          # preserves the native grammar, and never objc_msgSends the C++
          # std::shared_ptr setOverrides: ABI as an Objective-C object.
          grep -q 'WAGRMobileConfigNativeWriteOverrideDocument' src/Runtime/WAGRMobileConfigNativeEngine.m
          grep -q 'invalidateCachedLatestContext' src/Runtime/WAGRMobileConfigNativeEngine.m
          grep -q 'forceInvalidate' src/Runtime/WAGRMobileConfigNativeEngine.m
          grep -q 'direct_set_overrides_call_enabled.*NO' src/Runtime/WAGRMobileConfigNativeEngine.m
          ! grep -E -q 'objc_msgSend.*setOverrides|NSSelectorFromString\(@"setOverrides:"\).*objc_msgSend' src/Runtime/WAGRMobileConfigNativeEngine.m
          grep -q 'WAGRABPropsStableIDForTarget' src/Menu/WAGRABPropsMCNativeApplyUI.m
          grep -q 'WAGRMobileConfigNativeWriteOverrideDocument' src/Menu/WAGRABPropsMCNativeApplyUI.m

          # Debug must export enough runtime evidence to finish unresolved ABI and
          # object-graph questions from a real account session.
          grep -q 'watweaks_debug_runtime_v2' src/Menu/WAGRDebugDiagnosticsVC.m
          grep -q 'mobileconfig_live_capture' src/Menu/WAGRDebugDiagnosticsVC.m
          grep -q 'private_experimentation_classes' src/Menu/WAGRDebugDiagnosticsVC.m
          grep -q 'mobileconfig_native_engine' src/Menu/WAGRDebugNativeEngineEnrichment.m
          grep -q 'WAGRDebugDiagnosticsVC' src/Menu/WAGRMainSettingsVC.m

          # Existing semantic hook modules remain independent of a parallel
          # feature-master storage.
          ! grep -q 'kWAGREmployeeMaster' src/Hooks/WAGREmployeeHooks.xm
          ! grep -q 'kWAGRAuraSimulation' src/Hooks/WAAuraHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAGREmployeeHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAAuraHooks.xm
          grep -q 'parallelMaster=NO' src/Hooks/WAGRLiquidGlassHooks.xm

          # No Swizzle product/category should be reintroduced.
          ! grep -R -n -E 'Swizzle ABProps|Swizzle master|BundleSwizzle' \
              src/Menu src/Hooks

          # The native server fetch path remains the exact SharedModules path.
          grep -q 'networkingDependencyProvider' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'xmppConnectionABPropsRequestManager' src/Runtime/WAGRABPropsRequestManagerBridge.m
          grep -q 'requestFreshABProps:withCompletion:' src/Runtime/WAGRABPropsRequestManagerBridge.m
          ! grep -q 'MSHookFunction' src/Runtime/WAGRABPropsRequestManagerBridge.m

          # Sideload-safe rule for the edited surface.
          ! grep -R -n -E 'MSHookFunction|class_replaceMethod|%hookf' "${files[@]}"

      - name: Build rootless package
        run: |
          chmod +x build.sh
          make clean
          ./build.sh THEOS_PACKAGE_SCHEME=rootless

      - name: Verify package
        id: package
        run: |
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          name="WATweaks_dogfood2_rootless_${GITHUB_RUN_NUMBER}.deb"
          cp "$deb" "packages/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: |
            packages/${{ steps.package.outputs.name }}
            package-contents.txt
          if-no-files-found: error
