name: Build WATweaks Rootless

on:
  push:
    branches:
      - dogfood2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dogfood2 rootless
    runs-on: macos-15
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_MAKE_PATH: ${{ github.workspace }}/theos/makefiles
      THEOS_PACKAGE_SCHEME: rootless
      SDK_NAME: iPhoneOS26.2.sdk

    steps:
      - name: Checkout dogfood2
        uses: actions/checkout@v4
        with:
          ref: dogfood2
          submodules: recursive
          fetch-depth: 0

      - name: Normalize scripts
        run: |
          chmod +x ./build.sh
          find . -type f -name '*.sh' -exec chmod +x {} \;

      - name: Install build dependencies
        run: brew install ldid dpkg make

      - name: Use GNU make
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ env.THEOS }}
          submodules: recursive

      - name: Cache iPhoneOS 26.2 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/${{ env.SDK_NAME }}
          key: watweaks-${{ env.SDK_NAME }}

      - name: Download iPhoneOS 26.2 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/iOS-SDKs
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git /tmp/iOS-SDKs
          cd /tmp/iOS-SDKs
          git sparse-checkout set --no-cone "${SDK_NAME}"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv "$SDK_NAME" "$THEOS/sdks/"

      - name: Validate source layout
        run: |
          if [ -f scripts/wagr_validate_sources.py ]; then
            python3 scripts/wagr_validate_sources.py
          fi

      - name: Read package version
        id: package
        run: |
          base_version="$(awk '/^Version:/ {print $2; exit}' control)"
          package_name="WATweaks_dogfood2_v${base_version}_#${GITHUB_RUN_NUMBER}.deb"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Build rootless package
        run: ./build.sh

      - name: Normalize package artifact
        run: |
          mkdir -p packages
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "No .deb package was produced." >&2
            find . -maxdepth 5 -type f -name '*.deb' -print >&2 || true
            exit 1
          fi
          target="packages/${{ steps.package.outputs.package_name }}"
          if [ "$deb" != "$target" ]; then
            cp -f "$deb" "$target"
          fi
          ls -lah packages

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: WATweaks-dogfood2-rootless-${{ github.run_number }}
          path: packages/${{ steps.package.outputs.package_name }}
          if-no-files-found: error
